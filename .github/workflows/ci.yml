name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  web:
    name: Web contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test

  mobile:
    name: Mobile exam core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci
      - run: npm --prefix apps/mobile run lint
      - run: npm --prefix apps/mobile run typecheck
      - run: npm --prefix apps/mobile test -- --runInBand

  telegram-lite:
    name: Telegram Lite state machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: apps/telegram-lite/package-lock.json
      - run: npm --prefix apps/telegram-lite ci
      - run: npm --prefix apps/telegram-lite run lint
      - run: npm --prefix apps/telegram-lite run typecheck
      - run: npm --prefix apps/telegram-lite test

  desktop-protocol:
    name: Desktop Rust and TypeScript protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: apps/desktop-protocol/typescript/package-lock.json
      - run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.88.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-protocol/rust/target
          key: rust-1.88.0-${{ runner.os }}-${{ hashFiles('apps/desktop-protocol/rust/Cargo.lock') }}
      - run: cargo fmt --manifest-path apps/desktop-protocol/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop-protocol/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop-protocol/rust/Cargo.toml
      - run: npm --prefix apps/desktop-protocol/typescript ci
      - run: npm --prefix apps/desktop-protocol/typescript run lint
      - run: npm --prefix apps/desktop-protocol/typescript run typecheck
      - run: npm --prefix apps/desktop-protocol/typescript test

  api:
    name: FastAPI focus lease
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pypoetry
            services/api/.venv
          key: poetry-3.12.11-${{ runner.os }}-${{ hashFiles('services/api/poetry.lock') }}
      - run: python -m pip install --disable-pip-version-check poetry==2.2.1
      - working-directory: services/api
        run: poetry install --with dev --no-interaction
      - working-directory: services/api
        run: poetry run ruff format --check src tests
      - working-directory: services/api
        run: poetry run ruff check src tests
      - working-directory: services/api
        run: poetry run mypy src
      - working-directory: services/api
        run: poetry run pytest -q

  containers:
    name: Local demonstration containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yml build
      - name: Scan built images with pinned Trivy
        run: |
          for image in \
            onless-showcase-api:latest \
            onless-showcase-frontend:latest \
            onless-showcase-postgres:16.14-alpine3.24 \
            onless-showcase-dragonfly:1.39.0; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Start the demonstration stack
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml up -d --wait --wait-timeout 120
      - name: Smoke-test frontend and API
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8080/healthz | grep -qx ok
          curl --fail --show-error --silent http://127.0.0.1:8000/health/ready | grep -q '"status":"ready"'
      - name: Stop the demonstration stack
        if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml down -v

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run pinned independent scanners
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner /repo > /dev/null 2>&1
          gitleaks_status=$?
          if test "$gitleaks_status" -eq 0; then
            printf 'Gitleaks full-history scan: PASS\n' > gitleaks.txt
          else
            printf 'Gitleaks full-history scan: FAIL; review privately\n' > gitleaks.txt
          fi
          docker run --rm -v "$PWD:/repo" \
            trufflesecurity/trufflehog:3.97.0@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
            git file:///repo --only-verified --fail > /dev/null 2>&1
          trufflehog_status=$?
          if test "$trufflehog_status" -eq 0; then
            printf 'TruffleHog verified-secret scan: PASS\n' > trufflehog.txt
          else
            printf 'TruffleHog verified-secret scan: FAIL; review privately\n' > trufflehog.txt
          fi
          set -e
          test "$gitleaks_status" -eq 0
          test "$trufflehog_status" -eq 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-reports
          path: |
            gitleaks.txt
            trufflehog.txt
          if-no-files-found: error
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan lock files with pinned Trivy
        run: |
          docker run --rm -v "$PWD:/workspace" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format sarif --output /workspace/trivy.sarif /workspace
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-scan-report
          path: trivy.sarif
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
