name: onless-showcase

services:
  api:
    image: onless-showcase-api:latest
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - api-local
    restart: unless-stopped

  frontend:
    image: onless-showcase-frontend:latest
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - frontend-local
    restart: unless-stopped

networks:
  api-local:
    name: onless-showcase-api-local
  frontend-local:
    name: onless-showcase-frontend-local
