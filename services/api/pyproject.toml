[project]
name = "onless-focus-lease"
version = "0.1.0"
description = "Atomic Redis focus lease extracted for the Onless PTA showcase"
authors = [{ name = "Onless", email = "s.yoqubov@onless.uz" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "redis>=5.2,<9.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.poetry]
packages = [{ include = "onless_api", from = "src" }]

[tool.poetry.group.dev.dependencies]
fakeredis = { version = ">=2.30,<3.0", extras = ["lua"] }
httpx = ">=0.28,<1.0"
mypy = ">=1.15,<2.0"
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=0.25,<2.0"
ruff = ">=0.11,<1.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
